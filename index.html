    <!--
      Self-hosted, see scripts/fetch-fonts.mjs. Loading these from Google cost
      ~860ms of blocked render across two extra origins, and swapping them in
      asynchronously traded that for layout shift. Preloading local files avoids
      both. All three are variable fonts and were deduplicated by content — the
      three "weights" of Inter were byte-identical.
      Paths omit the deployment base because Vite prepends it here.
    -->
    <link rel="preload" href="/fonts/inter-f11d729b.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/space-grotesk-c0781ea2.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The mono face sets the width of the hero proof chips; arriving late it
         reflowed them and accounted for essentially all of the page's CLS. -->
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-3ae62151.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
